# Publishes the browser version (phones, tablets, computers) to GitHub Pages
# every time you push to the main branch.
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Installs the tracker + QR libraries and downloads the AI models into vendor/.
      # The Electron binary isn't needed for the website, so skip that big download.
      - name: Install and prepare offline files
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Collect website files
        run: |
          mkdir _site
          cp -r index.html share.html style.css manifest.webmanifest sw.js js icons vendor _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
